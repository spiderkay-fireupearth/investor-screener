name: Refresh US (07:00 SGT)

# 07:00 SGT = 23:00 UTC on the PREVIOUS calendar day, which is why the
# day-of-week field is 0-4 (Sun-Thu UTC) rather than 1-5. That maps to
# Mon-Fri mornings in Singapore.
#
# Why 07:00: the NYSE close lands at 04:00 SGT during US daylight saving and
# 05:00 SGT outside it. 07:00 clears both, plus the 1-2 hours vendors take to
# publish adjusted bars.
on:
  schedule:
    - cron: '0 23 * * 0-4'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cap tickers per market (blank = all)'
        required: false

concurrency:
  group: screener-refresh
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      # The store is what makes a Yahoo outage cost one day of freshness
      # rather than the whole history. Restore before the run, save after.
      # run_attempt is in the key so a re-run can save instead of colliding
      # with the cache its own first attempt already wrote.
      - name: Restore data store
        uses: actions/cache/restore@v4
        with:
          path: data
          key: screener-store-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: screener-store-

      - name: Run US refresh
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m src.run --region us \
            ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}

      - name: Save data store
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: screener-store-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-us-${{ github.run_number }}
          path: out/results.json
          retention-days: 90
