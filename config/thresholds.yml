# Pass/fail thresholds for each investment framework.
# Every value here is tunable without touching code.
#
# `min_tests_passed` controls strictness: set it equal to the number of tests
# for a pure AND screen, or lower it to allow near-misses through.
# Tests that cannot be evaluated (missing data) are recorded as "unknown"
# and, per `unknown_counts_as`, either fail the test or are excluded from the
# denominator. Default is strict: unknown = fail, because a value screen that
# silently passes names with missing balance sheets is worse than useless.

global:
  unknown_counts_as: fail          # fail | skip
  # Fundamentals depth differs by SOURCE, not by company: EDGAR gives 10+ years
  # for US filers, Yahoo about 4 for the Asian markets. Tests needing a deeper
  # window than a company's feed provides are marked unevaluable and drop out of
  # the denominator, and the pass bar scales down with them. Without this,
  # Buffett and Lynch are arithmetically impossible for every Asian name.
  min_history_years: 4
  # Floors set low so they still bite if the universe is broadened to mid
  # and small caps later. On the current large-cap universe every name
  # clears these by orders of magnitude, so today they are inert.
  min_market_cap_usd: 100000000    # 100m USD
  min_median_daily_turnover_usd: 250000
  # Financials and REITs distort EV/EBIT, ROIC and net-working-capital maths.
  # These sectors are excluded from Greenblatt and Klarman but kept elsewhere.
  capital_intensive_excluded_sectors:
    - Financial Services
    - Financials
    - Real Estate
    - Utilities

# ---------------------------------------------------------------------------
buffett:
  label: Quality compounders
  min_tests_passed: 6      # of 8
  tests:
    roe_consistency:
      metric: roe
      threshold: 0.15
      lookback_years: 10
      min_years_above: 8
    gross_margin_floor:
      metric: gross_margin_ttm
      threshold: 0.30
      operator: gte
    gross_margin_stability:
      metric: gross_margin_cv     # coefficient of variation over 10y
      threshold: 0.15
      operator: lte
    leverage:
      metric: debt_to_equity
      threshold: 0.5
      operator: lte
    fcf_consistency:
      metric: free_cash_flow
      threshold: 0
      lookback_years: 10
      min_years_above: 8
    share_count_discipline:
      metric: share_count_change_5y
      threshold: 0.0              # count today <= count 5y ago
      operator: lte
      min_history_years: 6        # needs a year -5 to compare against
    # Added from the 2010-2021 letters. "the key qualities we seek are...
    # good returns on the net tangible assets required to operate the
    # business". Return on NET TANGIBLE assets, not on equity: goodwill is
    # excluded, so a serial acquirer whose ROE is flattered by what it paid
    # over book gets caught here and nowhere else in this screen.
    # He gives NO threshold. The See's figure he quotes — "$4 million pre-tax
    # while utilizing only $8 million of net tangible assets", i.e. 50% — is a
    # fact about one company, not a rule. 20% is mine.
    returns_on_tangible_capital:
      metric: return_on_net_tangible_assets
      threshold: 0.20
      operator: gte
    # "Ideally, these assets should have the ability in inflationary times to
    # deliver output that will retain its purchasing-power value while
    # requiring a minimum of new capital investment." A composite flag: margin
    # holding, revenue per share growing, capital intensity low. The existing
    # gross-margin tests check the LEVEL and the STABILITY of margin but not
    # whether the company can raise prices, and nothing else here looks at how
    # much capital the growth consumed.
    inflation_resilience:
      metric: inflation_resilient       # 1 = all three conditions hold
      threshold: 1
      operator: gte

# ---------------------------------------------------------------------------
munger:
  label: Quality at a fair price
  min_tests_passed: 5      # of 6
  tests:
    roic_level:
      metric: roic_5y_avg
      threshold: 0.12
      operator: gte
    roic_persistence:
      metric: roic_cv_5y
      threshold: 0.30
      operator: lte
    operating_margin_trend:
      metric: operating_margin_slope_5y   # normalised slope, must not decline
      threshold: -0.01
      operator: gte
    valuation_sanity:
      metric: pe_ttm
      threshold: 25
      operator: lte
    # Inversion: what would make this a bad business? Any red flag fails.
    accrual_quality:
      metric: accruals_ratio       # (NI - CFO) / total assets
      threshold: 0.10
      operator: lte
    balance_sheet_integrity:
      metric: goodwill_to_assets
      threshold: 0.35
      operator: lte

# ---------------------------------------------------------------------------
schloss:
  label: Deep value, balance-sheet first
  min_tests_passed: 4      # of 5
  tests:
    price_to_tangible_book:
      metric: price_to_tangible_book
      threshold: 1.0
      operator: lt
    minimal_leverage:
      metric: debt_to_equity
      threshold: 0.30
      operator: lte
    near_multiyear_low:
      metric: pct_above_5y_low
      threshold: 0.35             # within 35% of its 5-year low
      operator: lte
    long_history:
      metric: years_of_data
      threshold: 10
      operator: gte
      min_history_years: 10       # can't tell a young company from a short feed
    earnings_durability:
      metric: loss_years_in_10
      threshold: 2
      operator: lte

# ---------------------------------------------------------------------------
klarman:
  label: Margin of safety, downside first
  min_tests_passed: 3      # of 4
  # Passes via EITHER the net-net route OR the cheap-and-cash-rich route.
  tests:
    absolute_cheapness:
      metric: ev_to_ebit
      threshold: 8.0
      operator: lte
      alt_metric: ncav_to_market_cap    # net-net route: satisfies on its own
      alt_threshold: 0.66
      alt_operator: gte
    balance_sheet_cushion:
      metric: net_cash_to_market_cap
      threshold: 0.0              # net cash positive, or at worst neutral
      operator: gte
    solvency:
      metric: net_debt_to_ebitda
      threshold: 2.5
      operator: lte
    cash_generation:
      metric: free_cash_flow_ttm
      threshold: 0
      operator: gt

# ---------------------------------------------------------------------------
lynch:
  label: Growth at a reasonable price
  min_tests_passed: 4      # of 5
  tests:
    peg:
      metric: peg_ratio
      threshold: 1.0
      operator: lte
      min_history_years: 6        # PEG needs a 5-year EPS CAGR
    growth_band_lower:
      metric: eps_cagr_5y
      threshold: 0.10
      operator: gte
      min_history_years: 6
    growth_band_upper:
      metric: eps_cagr_5y
      threshold: 0.40             # >40% is rarely sustainable — Lynch's own caution
      operator: lte
      min_history_years: 6
    leverage:
      metric: debt_to_equity
      threshold: 0.50
      operator: lte
    inventory_discipline:
      metric: inventory_growth_less_revenue_growth
      threshold: 0.0              # inventory must not outgrow sales
      operator: lte

# ---------------------------------------------------------------------------
# Sir John Templeton — bargain hunting at the point of maximum pessimism.
# His 16 rules are mostly behavioural; these five are the ones a screen can
# actually test. Rules about temperament, prayer, humility and diversification
# govern how you USE this list, not which names reach it.
templeton:
  label: Bargain at maximum pessimism
  min_tests_passed: 4      # of 6
  tests:
    # Rule 4 & 5: buy low, among quality
    cheap_earnings:
      metric: pe_ttm
      threshold: 15.0
      operator: lte
    cheap_book:
      metric: price_to_book
      threshold: 1.5
      operator: lte
    cheap_cash_flow:
      metric: price_to_cash_flow
      threshold: 10.0
      operator: lte
    # Rule 4 & 10: the point of maximum pessimism is a price fact, not a mood
    maximum_pessimism:
      metric: pct_below_52w_high
      threshold: 0.25             # at least 25% off its 52-week high
      operator: gte
    # Rule 5: bargains among QUALITY — a cheap bad business is not a Templeton buy
    quality_filter:
      metric: loss_years_in_10
      threshold: 2
      operator: lte
    survivability:
      metric: debt_to_equity
      threshold: 0.60
      operator: lte

# ---------------------------------------------------------------------------
# Howard Marks — where are we in the cycle, and what does that imply.
# The tests below are the per-name half. The market-cycle half is computed
# once per run and shown as a gauge; in Defensive mode `min_tests_passed`
# rises by one and in Opportunistic mode it falls by one, because the same
# evidence should demand more of you when everyone is greedy.
# ---------------------------------------------------------------------------
# Marks. Rebuilt against his own words in "The Truth about Investing"
# (Oaktree). Read this first, because it changes how the numbers below should
# be treated:
#
#   "Risk has to be dealt with, but not through quantification... Because that
#    likelihood can't be quantified, risk is best handled by experienced
#    experts applying subjective, qualitative judgment."
#   "Investing can't be reduced to an algorithm or a mechanical process."
#
# He gives NO numeric thresholds anywhere in the source material — not one
# percentage, ratio or valuation level. So every number in this block is my
# calibration, not his. What IS his is the *choice of test*: each one below is
# tied to a specific statement, quoted at the test.
#
# Two of his principles are deliberately NOT modelled, because faking them
# would be worse than admitting the gap:
#   - "second-level thinking" / thinking differently from the consensus. A
#     screen is by construction first-level. No test here approximates it.
#   - his margin of safety as a discount to *fair value*. We have no fair-value
#     estimate; `cheaper_than_its_market` is a relative-value stand-in and is
#     named as one.
marks:
  label: Risk-adjusted, cycle-aware
  min_tests_passed: 5      # of 8, before the cycle adjustment
  cycle_adjust: true
  tests:
    # "Superior results don't come from buying high quality assets, but from
    #  buying assets — regardless of quality — for less than they're worth."
    buying_things_well:
      metric: ev_to_ebit
      threshold: 15.0
      operator: lte
    # "Sometimes there are plentiful opportunities for unusual return with
    #  less-than-commensurate risk, and sometimes opportunities are few and
    #  risky." Cheapness measured against the current opportunity set, not
    #  against an absolute standard that ignores what else is on offer.
    cheaper_than_its_market:
      metric: ev_ebit_vs_market
      threshold: 0.85            # 15% below its own market's median name
      operator: lte
    # "It's not enough to survive 'on average'; you have to survive on the
    #  worst days." Peak-to-trough, which is what an owner actually sat through.
    survives_the_worst_day:
      metric: max_drawdown_5y
      threshold: 0.60
      operator: lte
    # "If we avoid the losers, the winners will take care of themselves."
    #  Below 1.0 = falls less than its own index when the index falls.
    avoids_the_losers:
      metric: downside_capture
      threshold: 1.00
      operator: lte
    # "As risk increases... the worst outcome worsens and ultimately becomes
    #  negative." A decade of accounts is the record of whether it did.
    no_history_of_losses:
      metric: loss_years_in_10
      threshold: 2
      operator: lte
    # Balance-sheet safety. Marks says nothing about leverage anywhere in the
    # source material — this test is entirely mine, kept because insolvency is
    # the mechanism by which "the worst outcome becomes negative".
    balance_sheet_safety:
      metric: net_debt_to_ebitda
      threshold: 3.0
      operator: lte
    # Earnings that turn into cash. Also mine, not his.
    earnings_quality:
      metric: accruals_ratio
      threshold: 0.10
      operator: lte
    # "Most investors behave pro-cyclically, to their own detriment... It's
    #  essential to act counter-cyclically." Don't buy on the day it makes a high.
    not_at_the_top:
      metric: pct_below_52w_high
      threshold: 0.05
      operator: gte

# ---------------------------------------------------------------------------
# Market-cycle gauge (Marks). Computed once per run from the primary index and
# the universe's own internals — no vendor sentiment feed needed.
market_cycle:
  enabled: true
  overbought_rsi: 70
  oversold_rsi: 30
  breadth_hot: 0.75            # >75% of names above their 200-day
  breadth_cold: 0.35
  vix_calm: 15
  vix_stressed: 28
  # Added so the gauge votes on the two markers Marks talks about most and
  # which the first version ignored: what credit charges for risk, and what
  # equities cost against their own history.
  hy_oas_calm: 350          # bp — below this, credit is not pricing default
  hy_oas_stressed: 700
  cape_rich: 30
  cape_cheap: 16

# ---------------------------------------------------------------------------
greenblatt:
  label: Magic Formula
  # Rank-based, not threshold-based. Pass = combined rank inside top N of the
  # eligible universe. Ranked within market by default so a single cheap market
  # doesn't crowd out the rest; set rank_scope: global to rank across all five.
  rank_scope: market          # market | global
  top_n: 30
  exclude_sectors_from_global: true
  tests:
    earnings_yield:
      metric: ebit_to_ev
      direction: desc
    return_on_capital:
      metric: ebit_to_invested_capital   # EBIT / (net working capital + net fixed assets)
      direction: desc

# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Soros, rebuilt from "The Alchemy of Finance".
#
# The old version of this screen was a macro gate plus momentum. That is not
# what the book describes, and the book says so directly:
#
#   "The conventional method is to predict the future course of earnings and
#    then to estimate the price that investors may be willing to pay for those
#    earnings. This method is inappropriate to the analysis of mortgage trusts
#    because THE PRICE THAT INVESTORS ARE WILLING TO PAY FOR THE SHARES IS AN
#    IMPORTANT FACTOR IN DETERMINING THE FUTURE COURSE OF EARNINGS."
#
# His unit of analysis is a company where the share price is an *input* to the
# fundamentals. So these tests do two things: confirm the loop is real and
# early, and reject the two configurations he identifies as terminal —
# stage DE (price rising through an earnings setback) and the conglomerate
# fingerprint (per-share earnings bought with overvalued paper).
#
# He gives exactly one piece of arithmetic (acquirer at 2x the target's
# multiple, doubling size, +50% EPS) and one worked example ($10 book, 12% ROE,
# shares sold at $20 -> book $13.33, EPS $1.20 to $1.60). Both are
# illustrations, not thresholds. Every number below is my calibration.
soros:
  label: Reflexivity and regime
  min_tests_passed: 5      # of 7
  tests:
    # AB: "the trend is strong enough to manifest itself in earnings per share"
    trend_shows_in_earnings:
      metric: eps_growth_1y
      threshold: 0.0
      operator: gt
    # BC: "When the underlying trend is finally recognized, it is reinforced by
    #      rising expectations." Recognition, measured against its OWN market.
    recognised_by_the_market:
      metric: rs_vs_market_index_6m
      threshold: 0.0
      operator: gt
    # CD: "Doubts arise, but the trend survives... Such testing may be repeated
    #      several times." A trend that has been tested and held.
    tested_and_held:
      metric: max_drawdown_1y
      threshold: 0.08
      operator: gte
    trend_intact_after_the_test:
      metric: price_above_sma200
      threshold: 1
      operator: gte
    # DE/EF, rejected: "conviction develops and it is no longer shaken by a
    # setback in the earning trend... Expectations become excessive, and fail
    # to be sustained by reality." Price running far ahead of earnings.
    expectations_not_yet_excessive:
      metric: reflexive_divergence     # 12m price return minus 1y EPS growth
      threshold: 0.40
      operator: lte
    # The conglomerate boom: "A few companies learned to produce earnings
    # growth through acquisitions... they could offer their own highly priced
    # stock in acquiring other companies." EPS outrunning revenue per share is
    # that trick's signature.
    growth_is_not_bought_with_paper:
      metric: eps_over_revenue_per_share_gap
      threshold: 0.25
      operator: lte
    # Act Two of the mortgage trusts: "With higher leverage, the rate of return
    # on equity can be maintained despite a lower effective yield."
    roe_not_propped_by_leverage:
      metric: roe_held_up_by_leverage   # 1 = the Act Two signature is present
      threshold: 0
      operator: lte
  # Macro gate: when risk conditions deteriorate, the whole Soros screen fails
  # regardless of single-name signals. This is the reflexivity brake.
  macro_gate:
    enabled: true
    hy_spread_max: 6.0                  # % — above this, credit stress
    yield_curve_min: -0.50              # 10y-2y; deeply inverted = late cycle

# ---------------------------------------------------------------------------
# Rogers, "Hot Commodities". Applies only to commodity-linked names.
#
# Read the caveat before the tests, because Rogers argues against this screen's
# whole premise:
#
#   "The Yale study found that investing in commodities companies is not
#    necessarily a substitute for commodities futures. The authors found that
#    from 1962 to 2003, 'the cumulative performance of futures has been TRIPLE
#    the cumulative performance of "matching" equities'."
#   "The smart investor looking into a copper company FIRST has to examine the
#    supply-demand dynamics of copper. Why not just stop after that analysis
#    and buy or sell the copper itself?"
#
# So: he would tell you to buy the commodity, not the miner. This screen exists
# because the app screens equities, and it is built to filter for the equities
# least damaged by the five idiosyncratic risks he names — balance sheet,
# dilution, management, jurisdiction, and the home stock market — since those
# are the reasons he says the equity underperforms the commodity.
#
# What this screen CANNOT do, and no threshold below pretends otherwise: the
# commodity-level supply and demand work. Inventories, days of consumption,
# rig and mine counts, project pipelines, ore grades, reserve audits — none of
# those are in any free feed this app uses. Rogers puts that analysis FIRST and
# treats the equity screen as secondary. Here it is missing entirely, and that
# is the single largest gap in this framework.
rogers:
  label: Commodity supply cycle
  min_tests_passed: 5      # of 7
  themes_only: true        # only names tagged with a commodity theme
  tests:
    # "Commodities cannot go to zero, while shares in Enron can (and did)."
    # The whole reason he prefers the commodity is that the equity can be
    # zeroed by its balance sheet, so that is the first thing to screen out.
    cannot_be_zeroed:
      metric: net_debt_to_ebitda
      threshold: 2.50
      operator: lte
    # Producers fund losses by issuing stock, which is how a right call on the
    # commodity still loses money in the equity.
    not_diluting_holders:
      metric: share_count_change_1y
      threshold: 0.05
      operator: lte
    # The supply thesis: "Virtually no new mine shafts have been opened in 20
    # years worldwide." At company level, capex below depreciation means the
    # asset base is shrinking rather than adding supply.
    not_adding_to_supply:
      metric: capex_to_depreciation
      threshold: 1.50
      operator: lte
    # Asset backing, since the commodity in the ground is the floor the equity
    # does not otherwise have.
    asset_backed:
      metric: price_to_tangible_book
      threshold: 3.00
      operator: lte
    # "the status and psychology of the pertinent stock market" — one of his
    # five named equity risks. Measured against the name's OWN market index.
    home_market_not_fighting_it:
      metric: rs_vs_market_index_12m
      threshold: 0.0
      operator: gte
    # He is scathing about producers that cannot convert a price rise into
    # cash: "Oil skyrocketed in the 1970s, but some oil stocks did not do that
    # well."
    converts_price_into_cash:
      metric: fcf_yield
      threshold: 0.0
      operator: gte
    # Bought before the market has fully repriced it, not after.
    not_already_repriced:
      metric: ev_ebit_vs_market
      threshold: 1.00
      operator: lte

# ---------------------------------------------------------------------------
# Graham / classic value. Attribution here is deliberately uneven and labelled
# per test, because the uploaded value guide is much thinner than its title
# suggests: it defines eight ratios and five valuation methods, and attaches a
# NUMBER to only three of them.
#
# Absent from that guide entirely, despite being standard Graham: the Graham
# number, the seven defensive-investor criteria, P/E <= 15, P/E x P/B <= 22.5,
# current ratio >= 2, the 20-year dividend record, Piotroski's real 9-point
# F-score, Altman Z, Beneish M, the magic formula, owner earnings and EPV.
# Where a test below uses one of those, it is marked [GRAHAM, NOT IN THE BOOK]
# so nobody later mistakes it for something the upload supports.
graham:
  label: Classic value, balance-sheet arithmetic
  min_tests_passed: 5      # of 9
  tests:
    # [FROM THE BOOK] "Stock Price < 2/3 x (Current Assets - Total Liabilities)
    # / no. of shares". Our ncav_to_market_cap is the same statement inverted:
    # >= 1.5 means the price is at or below two-thirds of net current asset
    # value. Note the definition uses TOTAL liabilities, not current — which is
    # what this app already computes.
    net_net_two_thirds:
      metric: ncav_to_market_cap
      threshold: 1.5
      operator: gte
    # [FROM THE BOOK] "In general, PEG ratio less than 1 is deem as
    # undervalued." One of only three numbers the guide states.
    peg_fair_or_better:
      metric: peg_ratio
      threshold: 1.0
      operator: lte
      min_history_years: 6
    # [GRAHAM, NOT IN THE BOOK] sqrt(22.5 x EPS x book value per share).
    graham_number_discount:
      metric: price_to_graham_number
      threshold: 1.0
      operator: lte
    # [GRAHAM, NOT IN THE BOOK] the 15 x 1.5 rule, stated as a product.
    pe_times_pb_limit:
      metric: pe_times_pb
      threshold: 22.5
      operator: lte
    # [PARTLY FROM THE BOOK] The guide defines the current ratio — "simply
    # Current Assets / Current Liabilities" — but states no threshold. 2.0 is
    # Graham's, from The Intelligent Investor.
    liquidity:
      metric: current_ratio
      threshold: 2.0
      operator: gte
    # [GRAHAM, NOT IN THE BOOK] Earnings stability over the decade.
    no_loss_years:
      metric: loss_years_in_10
      threshold: 0
      operator: lte
    # [PARTLY FROM THE BOOK] The guide defines the payout ratio but sets no
    # level. Requiring merely that one exists is the weakest honest form of
    # Graham's dividend-record criterion, which needs 20 years of history this
    # app does not have.
    pays_a_dividend:
      metric: payout_ratio
      threshold: 0.0
      operator: gt
    # [FROM THE BOOK] The guide's own CNAV method: cash and property at full
    # value, equipment, receivables, investments, inventories and income-
    # generating intangibles at half, goodwill at zero, less total liabilities.
    # It states NO discount threshold anywhere — its own case studies bought at
    # discounts of 19%, 25%, 44% and 46%, so 20% is the mild end of its own
    # revealed practice rather than a stated rule.
    conservative_asset_discount:
      metric: cnav_discount
      threshold: 0.20
      operator: gte
    # [FROM THE BOOK] "A 3-point system based on Dr Joseph Piotroski's F-score
    # to find fundamentally strong low price-to-book stocks." Profitable,
    # positive operating cash flow, low debt. The guide gives no cutoff for any
    # component; requiring all three is the strictest reading of three points.
    pof_score:
      metric: pof_score
      threshold: 3
      operator: gte

# ---------------------------------------------------------------------------
technical:
  label: Technical timing overlay
  min_tests_passed: 4      # of 6
  tests:
    above_long_ma:
      metric: price_above_sma200
      threshold: 1
      operator: gte
    golden_cross_regime:
      metric: sma50_above_sma200
      threshold: 1
      operator: gte
    rsi_band_lower:
      metric: rsi_14
      threshold: 40
      operator: gte
    rsi_band_upper:
      metric: rsi_14
      threshold: 70               # not overbought — this is a value app
      operator: lte
    macd_momentum:
      metric: macd_histogram
      threshold: 0
      operator: gt
    volume_participation:
      metric: vol20_over_vol50
      threshold: 0.80
      operator: gte

# ---------------------------------------------------------------------------
# Composite: how many frameworks must a name clear to appear in the screener.
composite:
  min_frameworks_passed: 2
  # Always surface names that clear these regardless of the count above.
  always_surface_if_passed:
    - greenblatt
    - klarman
