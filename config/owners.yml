# Who else owns this? -------------------------------------------------------
#
# A short list of investors whose disclosed positions are worth flagging on a
# row. A tag here is NOT a recommendation and it is NOT current: read the two
# limitations below before reading any badge on the page.
#
# 1. A 13F IS A CENSUS OF THE PAST. Managers over $100m in US equities file
#    within 45 days of quarter end. The Q2 2026 filings below describe
#    positions held on 30 June 2026 and were filed in mid-August. A position
#    can have been sold the day after the quarter closed and the form would
#    still show it. Treat a badge as "owned this on the report date", never as
#    "owns this now".
#
# 2. A 13F COVERS US-LISTED LONG EQUITY ONLY. No shorts, no bonds, no foreign
#    listings. Berkshire's Japanese trading-house stakes are among its largest
#    equity positions on earth and appear in no 13F ever filed. That is why the
#    `manual:` block exists — those rows are sourced from company disclosure,
#    are marked as such on the page, and have to be maintained by hand.
#
# WHAT IS DELIBERATELY EXCLUDED, and why it matters here:
#
#   Convertible bonds. Oaktree's Q2 filing has 145 rows and roughly 60% of them
#   are converts, reported in principal rather than shares. A convert is a
#   credit position, routinely delta-hedged with a SHORT in the same company's
#   stock. Badging Sea Ltd because Oaktree owns its converts would state the
#   opposite of the truth about half the time.
#
#   Puts and calls. Oaktree's single largest reported line is a $1.01bn PUT on
#   SPY, and its second is a $652m put on QQQ. Those are bearish. A naive
#   "appears in the filing" rule would have stamped OT on the S&P 500 itself.
#
#   So: `positions` below holds COMMON STOCK LONGS ONLY. The excluded counts
#   are recorded per owner so the page can say what was left out rather than
#   quietly dropping it.
#
# TO REFRESH each quarter: run `python -m tools.update_owners --help`. It
# rewrites this file from the SEC filings and prints a diff. Nothing in the
# refresh pipeline reads EDGAR for this — the data is static by design, so a
# bad quarter at the SEC can never delay or break a screener run.

