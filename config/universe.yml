# Funds, not companies. Revenue, equity, ROE and EV/EBIT are undefined for an
# ETF, so the six value frameworks are marked n/a rather than failed — the same
# treatment financials get for Greenblatt. Prices, technicals, the Soros regime
# read and the full deep-dive quantitative suite all still apply.
# Rogers argues the commodity beats the miner three to one over 41 years, so
# the buyable vehicles are carried in the universe as well as on the board.
# These are ETFs: they have no accounts, so every company framework reports
# not-applicable rather than failing them on a missing balance sheet.
