# Yahoo FX tickers used to normalise every figure to USD before cross-market ranking.
# The first four are trading currencies. The rest are REPORTING currencies that
# appear in this universe without being any market's trading currency — many
# HKEX-listed mainland issuers report in CNY while trading in HKD, and several
# SGX names report in USD. Without a rate for the reporting currency, every
# valuation ratio for those companies is wrong by the exchange rate.
fx_pairs:
  SGD: "SGDUSD=X"
  HKD: "HKDUSD=X"
  THB: "THBUSD=X"
  IDR: "IDRUSD=X"
  CNY: "CNYUSD=X"
  CAD: "CADUSD=X"          # Cameco, NexGen, Denison and Teck file in CAD
  TWD: "TWDUSD=X"          # TSMC files in New Taiwan dollars, trades as a USD ADR
  EUR: "EURUSD=X"
  GBP: "GBPUSD=X"
  JPY: "JPYUSD=X"
  MYR: "MYRUSD=X"
  USD: null

# FRED series for the Soros macro/regime overlay. Free API key required.
macro_series:
  us_10y: DGS10
  us_2y: DGS2
  us_3m: DTB3
  hy_credit_spread: BAMLH0A0HYM2
  ig_credit_spread: BAMLC0A0CM
  usd_broad_index: DTWEXBGS
  vix: VIXCLS
  # Lynch's Rule of 20 needs an inflation rate. This is the index LEVEL; the
  # run converts it to a year-on-year rate before using it, because adding a
  # CPI level of 320 to a P/E of 22 would be arithmetic without meaning.
  us_cpi: CPIAUCSL
  # Three-month VIX, for the term structure. Spot above three-month means the
  # curve is backwardated, which is what a real panic looks like as distinct
  # from ordinary nervousness — and a single VIX level cannot tell them apart.
  vix_3m: VXVCLS


# ---------------------------------------------------------------------------
# Market psychology. Everything here is CONTRARIAN in application and none of
# it is a timing signal on its own: sentiment describes positioning, never
# value. Feeds that are absent report themselves absent rather than falling
# back to a proxy.
sentiment:
  vix_calm: 15.0
  vix_panic: 30.0
  rsi_hot: 70.0
  rsi_cold: 30.0
  pcr_fear: 1.00
  pcr_greed: 0.60
  # Put/call ratio. There is no free, stable, machine-readable daily feed for
  # this that does not change shape every few months, so it is OFF by default
  # and the composite runs on the remaining six factors, saying so. Point this
  # at a CSV whose last column is the daily total put/call ratio and it fills
  # in; leave it empty and nothing breaks.
  put_call_url: ""
  # Commitments of Traders. Contract CODES, not names: the CFTC's market names
  # are long and inconsistent, the codes are stable.
  cot_contracts:
    "E-mini S&P 500": "13874A"
    "Gold": "088691"
    "Copper": "085692"
    "Crude oil (WTI)": "067651"
  cot_weeks: 160


# ---------------------------------------------------------------------------
# Thematic tags. These names are unioned into their listing market (all US
# here) and deduplicated — a name already in the S&P 500 or Nasdaq-100 simply
# gains a tag rather than being fetched twice. Themes filter independently of
# markets in the UI, so "Uranium + Greenblatt" or "Copper + Technical pass" work.
#
# A ticker may appear in several themes; tags are a list, not a single value.
themes:
  # -------------------------------------------------------------------------
  # US government equity stakes. HAND-MAINTAINED — there is no machine-readable
  # source, because there is no consolidated federal register. The stakes sit
  # across at least four agencies (Commerce, Defense, the Development Finance
  # Corporation and Energy), and the two most careful public trackers disagree
  # on both the count and the total: CFR says 37 deals worth $27.6bn, Fortune
  # says $26.7bn with a different split by agency. That disagreement is itself
  # the evidence that no register exists.
  #
  # Only LISTED companies can appear here. Several stakes are in private firms
  # (xLight, Vulcan Elements, Westinghouse) which file nothing and cannot be
