# Investable universe — index constituents only.
# Rationale: Yahoo's fundamentals quality degrades sharply on Asian small caps,
# and deep-value screens (Schloss/Klarman) otherwise fill with illiquid
# controlling-shareholder value traps. Index membership is the liquidity filter.
#
# Constituent lists are reviewed semi-annually by the index providers.
# Refresh these lists ~quarterly; `python -m src.run --check-universe` reports
# tickers that have stopped returning data (a proxy for delisting/removal).

markets:
  US:
    name: United States
    index_ticker: "^GSPC"
    index_name: S&P 500
    currency: USD
    timezone: America/New_York
    close_local: "16:00"
    fundamentals_provider: edgar     # audited filings, free, permanent
    price_provider: yahoo
    # S&P 500 constituents are fetched dynamically (500 names is impractical to
    # pin here and membership churns). seed_fallback is used only if the fetch fails.
    constituents_source: dynamic
    # Additional US indices unioned in and deduplicated. Most of the Nasdaq-100
    # already sits in the S&P 500; the value here is the ~25 names the S&P
    # cannot hold because they are foreign-domiciled — PDD, MELI, ARM, AZN,
    # BIDU, JD, NTES — plus recent listings not yet added.
    extra_indices:
      - name: Nasdaq-100
        url: "https://en.wikipedia.org/wiki/Nasdaq-100"
        min_expected: 80
        seed_fallback:
          - PDD
          - MELI
          - ARM
          - AZN
          - BIDU
          - JD
          - NTES
          - ASML
          - CCEP
          - GFS
          - ZS
          - TEAM
          - MDB
          - DDOG
          - SMCI
          - APP
          - TTD
          - AXON
          - MSTR
          - PLTR
          - ILMN
          - BIIB
          - MRNA
          - SIRI
          - WBD
          - LCID
          - CSGP
          - "ON"          # quoted: bare ON is the YAML boolean true
          - ANSS
          - DXCM
    # Nasdaq coverage BEYOND the Nasdaq-100, deduplicated against everything
    # already in the universe. The directory carries ~4,000 securities, which
    # is far more than this pipeline can fetch fundamentals for, so the
    # narrowing is explicit:
    #
    #   market_categories  Q = Global Select (the top tier, ~1,400 names),
    #                      G = Global Market, S = Capital Market. Add G or S to
    #                      go further down the size scale.
    #   max_names          how many survive the liquidity ranking. Each name
    #                      costs one EDGAR fundamentals call and one price
    #                      history on every US run, so this is the dial that
    #                      trades coverage against run time.
    #   min_median_turnover_usd
    #                      the floor a candidate must trade above to be worth
    #                      screening at all.
    #
    # Ranked on median dollar turnover rather than alphabetically, because the
    # directory has no market cap and an alphabetical cut of 4,000 names is a
    # universe of companies beginning with A.
    nasdaq_listed:
      enabled: true
      url: "https://www.nasdaqtrader.com/dynamic/symdir/nasdaqlisted.txt"
      # Q = Global Select (top tier), G = Global Market. Global Market holds a
      # great many legitimate mid-caps, and restricting to Q alone made them
      # unreachable no matter how high max_names went. S (Capital Market) is
      # still excluded — that tier is genuinely small and speculative.
      market_categories: ["Q", "G"]
      exclude_etfs: true
      normal_status_only: true
      # The dial that trades coverage against run time. At ~1.5s per name a US
      # run of ~1,040 names lands near 26 minutes against a 60-minute limit.
      max_names: 500
      min_median_turnover_usd: 20000000
      # Names that bypass the liquidity ranking entirely. The ranking answers
      # "what is worth screening in general"; this answers "what do I actually
      # hold", which no turnover cut can know. They must still exist in the
      # directory and pass the structural filters — this admits a real company
      # that ranked below the cap, it does not invent one.
      always_include:
        - CRSP
    seed_fallback:
      - AAPL
      - MSFT
      - GOOGL
      - AMZN
      - NVDA
      - META
      - BRK-B
      - JPM
      - JNJ
      - PG
      - XOM
      - UNH
      - HD
      - CVX
      - KO
      - PEP
      - ABBV
      - MRK
      - COST
      - WMT

